<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV Projects</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f4f6fb;
      color: #1f2937;
    }
    .page {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }
    h1 { margin-bottom: 8px; }
    .subtitle { margin-top: 0; color: #4b5563; }
    .project-list {
      list-style: none;
      padding: 0;
      margin: 24px 0 0;
      display: grid;
      gap: 12px;
    }
    .project-list a {
      display: block;
      text-decoration: none;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 16px;
      color: inherit;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    .project-list a:hover {
      border-color: #cbd5e1;
      box-shadow: 0 6px 20px rgba(0,0,0,.08);
    }
    code {
      background: #eef2ff;
      border-radius: 6px;
      padding: 2px 6px;
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>CV Projects</h1>
    <p class="subtitle">Published with GitHub Pages.</p>

    <ul class="project-list">
      <li>
        <a href="./projects/finger-bent-check/">
          <strong>Finger Bent Check Simulation</strong><br>
          Interactive visualization of fingertip vs knuckle Y-axis logic.
        </a>
      </li>
    </ul>

    <p>Add more projects under <code>projects/&lt;project-name&gt;/index.html</code> and link them here.</p>
  </main>
</body>
</html>
